<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Прототип информационно-аналитической системы ситуационного центра банка в части EXIM"
    />
    <title>Ситуационный центр EXIM</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --bg-soft: #f6fbf8;
        --surface: #ffffff;
        --surface-mint: #e8f7ef;
        --surface-green: #f0fbf5;
        --primary: #007a3d;
        --primary-strong: #064e3b;
        --primary-soft: #d9f2e5;
        --text: #17231e;
        --muted: #607268;
        --muted-strong: #3c5147;
        --border: #dde9e1;
        --border-strong: #c7ddd0;
        --yellow: #f4b740;
        --yellow-soft: #fff6dc;
        --red: #e5484d;
        --red-soft: #fff0f0;
        --green-soft: #e6f7ee;
        --shadow: 0 18px 40px rgba(10, 62, 39, 0.08);
        --shadow-soft: 0 10px 24px rgba(10, 62, 39, 0.06);
        --radius: 8px;
        font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        font-size: 16px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--bg);
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--text);
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid rgba(0, 122, 61, 0.24);
        outline-offset: 2px;
      }

      a {
        color: inherit;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .icon {
        flex: 0 0 auto;
      }

      .app-shell {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        min-height: 100dvh;
      }

      .sidebar {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        flex-direction: column;
        height: 100dvh;
        padding: 22px 18px;
        background: linear-gradient(180deg, #ffffff 0%, #f5fbf8 100%);
        border-right: 1px solid var(--border);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 52px;
        padding: 0 8px 18px;
        border-bottom: 1px solid var(--border);
      }

      .brand-mark {
        position: relative;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: var(--primary);
      }

      .brand-mark::before {
        position: absolute;
        inset: 8px 7px;
        content: "";
        clip-path: polygon(50% 0, 100% 100%, 0 100%);
        background: #ffffff;
      }

      .brand strong {
        display: block;
        color: var(--primary-strong);
        font-size: 1.35rem;
      }

      .brand small,
      .sidebar-note span,
      .topbar span,
      .section-header p,
      .card-heading p,
      .compact-log small,
      small {
        color: var(--muted);
      }

      .sidebar nav {
        display: grid;
        gap: 4px;
        padding: 18px 0;
      }

      .sidebar nav button {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        width: 100%;
        padding: 10px 12px;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        color: var(--muted-strong);
        text-align: left;
      }

      .sidebar nav button:hover,
      .sidebar nav button.active {
        background: var(--surface-mint);
        color: var(--primary-strong);
      }

      .sidebar nav button.active {
        box-shadow: inset 3px 0 0 var(--primary);
        font-weight: 700;
      }

      .sidebar-note {
        display: grid;
        gap: 8px;
        margin-top: auto;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow-soft);
      }

      .main-shell {
        min-width: 0;
        background: var(--bg);
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 78px;
        padding: 14px 28px;
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(12px);
      }

      .topbar strong {
        display: block;
        color: var(--primary-strong);
        font-size: 1.3rem;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .period-select,
      .filter-field,
      .search-field {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 7px 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
      }

      .period-select span,
      .filter-field span {
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
      }

      select,
      input {
        min-width: 0;
        border: 0;
        background: transparent;
        color: var(--text);
      }

      select {
        appearance: auto;
        font-weight: 700;
      }

      .mobile-menu {
        display: none;
      }

      main {
        padding: 28px;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 22px;
        align-items: start;
      }

      .workspace-main {
        min-width: 0;
      }

      .content-stack {
        display: grid;
        gap: 22px;
      }

      .section-header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
      }

      .section-header h1 {
        margin: 0 0 8px;
        color: var(--primary-strong);
        font-size: clamp(1.65rem, 2.6vw, 2.55rem);
        line-height: 1.08;
      }

      .section-header p {
        max-width: 840px;
        margin: 0;
        line-height: 1.55;
      }

      .situation-strip,
      .advisory-banner {
        display: grid;
        grid-template-columns: minmax(220px, 0.45fr) minmax(0, 1fr);
        gap: 18px;
        padding: 18px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface-green);
      }

      .situation-strip span,
      .advisory-banner span {
        color: var(--muted);
        font-weight: 700;
      }

      .situation-strip strong,
      .advisory-banner strong {
        display: block;
        margin-top: 5px;
        color: var(--primary-strong);
        font-size: 1.25rem;
        line-height: 1.25;
      }

      .situation-strip p,
      .advisory-banner p {
        margin: 0;
        line-height: 1.55;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 14px;
      }

      .metric-card,
      .chart-card,
      .product-card,
      .scenario-card,
      .recommendation-card,
      .quality-card,
      .integration-card,
      .budget-card,
      .decision-journal,
      .panel-stat,
      .country-card,
      .route-card,
      .alert-card,
      .user-row {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow-soft);
      }

      .metric-card {
        display: grid;
        gap: 8px;
        min-height: 170px;
        padding: 16px;
        text-align: left;
      }

      .metric-card:hover {
        border-color: var(--border-strong);
        box-shadow: var(--shadow);
        transform: translateY(-1px);
      }

      .metric-topline {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        color: var(--muted);
        font-size: 0.88rem;
        font-weight: 800;
      }

      .metric-card strong {
        color: var(--primary-strong);
        font-size: clamp(1.6rem, 2.2vw, 2.25rem);
        line-height: 1.05;
      }

      .metric-delta {
        font-weight: 800;
      }

      .trend-up {
        color: var(--primary);
      }

      .trend-down {
        color: var(--red);
      }

      .trend-stable {
        color: var(--muted-strong);
      }

      .metric-card small {
        line-height: 1.35;
      }

      .dashboard-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(320px, 0.75fr);
        gap: 18px;
      }

      .two-column {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .three-column {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .chart-card {
        min-width: 0;
        padding: 18px;
      }

      .card-heading {
        display: grid;
        gap: 5px;
        margin-bottom: 16px;
      }

      .inline-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
      }

      .card-heading h3,
      .product-card h3,
      .scenario-card h3,
      .recommendation-card h3,
      .quality-card h3,
      .integration-card h3,
      .budget-card h3 {
        margin: 0;
        color: var(--primary-strong);
        font-size: 1rem;
        line-height: 1.3;
      }

      .card-heading p {
        margin: 0;
        line-height: 1.45;
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: fit-content;
        min-height: 28px;
        padding: 4px 9px;
        border-radius: 999px;
        border: 1px solid transparent;
        font-size: 0.78rem;
        font-weight: 800;
        line-height: 1.1;
        white-space: nowrap;
      }

      .status-green {
        background: var(--green-soft);
        border-color: #b7e4c7;
        color: #12643d;
      }

      .status-yellow {
        background: var(--yellow-soft);
        border-color: #f2d58a;
        color: #805b00;
      }

      .status-red {
        background: var(--red-soft);
        border-color: #f4b0b2;
        color: #9b1c24;
      }

      .status-neutral {
        background: #f3f6f4;
        border-color: var(--border);
        color: var(--muted-strong);
      }

      .chart-scroll {
        overflow-x: auto;
      }

      .line-chart {
        min-width: 560px;
        width: 100%;
        height: auto;
      }

      .grid-lines line {
        stroke: #edf3ef;
        stroke-width: 1;
      }

      .line-actual,
      .line-forecast,
      .sparkline path {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .line-actual {
        stroke: var(--primary);
        stroke-width: 4;
      }

      .line-forecast {
        stroke: var(--yellow);
        stroke-width: 4;
        stroke-dasharray: 8 8;
      }

      .point-actual {
        fill: var(--primary);
        stroke: #ffffff;
        stroke-width: 2;
      }

      .point-forecast {
        fill: var(--yellow);
        stroke: #ffffff;
        stroke-width: 2;
      }

      .line-chart text {
        fill: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .axis-label {
        fill: var(--muted);
      }

      .chart-legend {
        display: flex;
        gap: 16px;
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 700;
      }

      .legend-line {
        display: inline-block;
        width: 24px;
        height: 4px;
        margin-right: 6px;
        border-radius: 999px;
        vertical-align: middle;
      }

      .legend-line.actual {
        background: var(--primary);
      }

      .legend-line.forecast {
        background: repeating-linear-gradient(90deg, var(--yellow) 0 8px, transparent 8px 13px);
      }

      .donut-wrap {
        display: grid;
        grid-template-columns: 170px minmax(0, 1fr);
        gap: 16px;
        align-items: center;
      }

      .donut-chart {
        width: 160px;
        height: 160px;
      }

      .donut-base {
        fill: none;
        stroke: #eef5f0;
        stroke-width: 22;
      }

      .donut-segment {
        fill: none;
        stroke-width: 22;
        stroke-linecap: butt;
        transform: rotate(-90deg);
        transform-origin: 80px 80px;
      }

      .donut-total {
        fill: var(--primary-strong);
        font-size: 25px;
        font-weight: 900;
      }

      .donut-label {
        fill: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .donut-legend {
        display: grid;
        gap: 9px;
        min-width: 0;
      }

      .donut-legend span {
        display: grid;
        grid-template-columns: 12px minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        color: var(--muted-strong);
        font-size: 0.9rem;
      }

      .donut-legend i {
        width: 10px;
        height: 10px;
        border-radius: 3px;
      }

      .country-cards,
      .quality-grid,
      .integration-grid,
      .budget-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }

      .country-cards.wide {
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      }

      .country-card,
      .quality-card,
      .integration-card,
      .budget-card {
        display: grid;
        gap: 10px;
        padding: 14px;
      }

      .country-card strong,
      .quality-card strong,
      .budget-card strong {
        color: var(--primary-strong);
        font-size: 1.35rem;
      }

      .mini-progress {
        position: relative;
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: #e8f0eb;
      }

      .mini-progress span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--primary), #3dbd78);
      }

      .compact-list,
      .opportunity-list,
      .action-list,
      .settings-list,
      .method-list,
      .milestone-list {
        display: grid;
        gap: 10px;
      }

      .list-button,
      .action-list button,
      .link-button {
        border: 0;
        background: transparent;
        color: inherit;
      }

      .list-button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 58px;
        width: 100%;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        text-align: left;
      }

      .list-button:hover {
        background: var(--surface-green);
      }

      .list-button span {
        display: grid;
        gap: 4px;
        min-width: 0;
      }

      .list-button small {
        line-height: 1.3;
      }

      .opportunity-list article,
      .method-list article,
      .milestone-list article {
        display: grid;
        gap: 5px;
        padding: 12px;
        border-left: 3px solid var(--primary);
        border-radius: 0 var(--radius) var(--radius) 0;
        background: var(--surface-green);
      }

      .action-list button {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        padding: 11px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        text-align: left;
      }

      .action-list button:hover {
        border-color: var(--primary);
        color: var(--primary-strong);
      }

      .product-grid,
      .scenario-grid,
      .recommendation-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
      }

      .product-card,
      .scenario-card,
      .recommendation-card {
        display: grid;
        gap: 14px;
        padding: 18px;
      }

      .product-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .product-stats span {
        display: grid;
        gap: 3px;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .product-stats b {
        color: var(--primary-strong);
        font-size: 1.08rem;
      }

      .bullet {
        display: grid;
        gap: 8px;
      }

      .bullet-label {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        color: var(--muted);
        font-size: 0.86rem;
        font-weight: 700;
      }

      .bullet-track {
        position: relative;
        display: grid;
        grid-template-columns: 30% 35% 35%;
        height: 16px;
        overflow: hidden;
        border-radius: 999px;
        background: #f1f5f2;
      }

      .bullet-zone.red {
        background: #ffe4e5;
      }

      .bullet-zone.yellow {
        background: #fff1bd;
      }

      .bullet-zone.green {
        background: #dff4e9;
      }

      .bullet-track strong {
        position: absolute;
        inset: 4px auto 4px 0;
        border-radius: 999px;
        background: var(--primary);
      }

      .bullet-track i {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 3px;
        background: var(--text);
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        min-width: 760px;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 12px 10px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: top;
        font-size: 0.9rem;
      }

      th {
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 900;
        text-transform: uppercase;
      }

      tbody tr:hover {
        background: var(--surface-green);
      }

      .link-button {
        padding: 0;
        color: var(--primary-strong);
        font-weight: 800;
        text-align: left;
        text-decoration: underline;
        text-decoration-color: rgba(0, 122, 61, 0.25);
        text-underline-offset: 4px;
      }

      .filter-bar {
        display: grid;
        grid-template-columns: minmax(220px, 1.2fr) repeat(5, minmax(150px, 1fr));
        gap: 10px;
        align-items: end;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface-green);
      }

      .filter-field {
        display: grid;
        align-items: stretch;
        gap: 4px;
      }

      .search-field {
        background: #ffffff;
      }

      .search-field input {
        width: 100%;
        min-height: 28px;
      }

      .mini-trend {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .sparkline {
        width: 110px;
        height: 34px;
      }

      .sparkline path {
        stroke: var(--primary);
        stroke-width: 3;
      }

      .supply-chain-map {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface-green);
      }

      .chain-step-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 0 0 auto;
      }

      .chain-step {
        display: grid;
        gap: 8px;
        width: 220px;
        min-height: 190px;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: #ffffff;
        box-shadow: var(--shadow-soft);
      }

      .chain-step.attention {
        border-color: #f3b4b6;
        background: #fff9f9;
      }

      .chain-step span,
      .chain-step small {
        color: var(--muted);
        font-weight: 700;
      }

      .chain-step strong {
        color: var(--primary-strong);
      }

      .chain-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .chain-arrow {
        color: var(--primary);
      }

      .route-card,
      .alert-card,
      .user-row {
        display: grid;
        gap: 10px;
        padding: 14px;
      }

      .route-card div,
      .alert-card div,
      .user-row div {
        display: grid;
        gap: 4px;
      }

      .risk-matrix {
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr);
        grid-template-rows: minmax(260px, auto) 24px;
        gap: 8px;
      }

      .matrix-y {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        align-self: center;
        color: var(--muted);
        font-weight: 800;
      }

      .matrix-x {
        grid-column: 2;
        color: var(--muted);
        font-weight: 800;
        text-align: center;
      }

      .matrix-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(48px, 1fr));
        grid-template-rows: repeat(3, minmax(74px, 1fr));
        gap: 8px;
      }

      .matrix-cell {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-height: 70px;
        border: 1px solid transparent;
        border-radius: var(--radius);
      }

      .matrix-cell:disabled {
        cursor: default;
      }

      .matrix-cell span {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        color: var(--text);
        font-size: 0.78rem;
        font-weight: 900;
      }

      .matrix-green {
        background: #e7f7ed;

          normalized.includes("принято") ||
          normalized.includes("стабильно") ||
          normalized.includes("работает") ||

      // -----------------------------------------------------------------
      // CHART RENDERERS
      // -----------------------------------------------------------------
      function renderLineChart(labels, series, forecast, label, unit = "", height = 240) {
        const allValues = [...series, ...(forecast ?? [])];
        const min = Math.min(...allValues) * 0.96;
        const max = Math.max(...allValues) * 1.04;
        const width = 720;
        const padding = 38;
        const totalPoints = allValues.length;
        const xStep = (width - padding * 2) / Math.max(totalPoints - 1, 1);
        const y = (val) => height - padding - ((val - min) / (max - min)) * (height - padding * 2);
        const x = (idx) => padding + idx * xStep;

        const actualPath = series.map((val, idx) => `${idx === 0 ? "M" : "L"} ${x(idx)} ${y(val)}`).join(" ");
        const forecastStart = series.length - 1;
        const forecastValues = forecast ? [series[series.length - 1], ...forecast] : [];
        const forecastPath = forecastValues
          .map((val, idx) => `${idx === 0 ? "M" : "L"} ${x(forecastStart + idx)} ${y(val)}`)
          .join(" ");

        let svgHtml = `<svg viewBox="0 0 ${width} ${height}" class="line-chart">`;
        svgHtml += `<g class="grid-lines">`;
        [0, 1, 2, 3].forEach((tick) => {
          const yy = padding + tick * ((height - padding * 2) / 3);
          svgHtml += `<line x1="${padding}" x2="${width - padding}" y1="${yy}" y2="${yy}" />`;
        });
        svgHtml += `</g>`;

        svgHtml += `<path d="${actualPath}" class="line-actual" />`;
        if (forecast) {
          svgHtml += `<path d="${forecastPath}" class="line-forecast" />`;
        }

        series.forEach((val, idx) => {
          svgHtml += `
            <g>
              <circle cx="${x(idx)}" cy="${y(val)}" r="4.5" class="point-actual" />
              <text x="${x(idx)}" y="${y(val) - 12}" text-anchor="middle">${val}${unit}</text>
            </g>
          `;
        });

        if (forecast) {
          forecast.forEach((val, idx) => {
            const totalIdx = series.length + idx;
            svgHtml += `
              <g>
                <circle cx="${x(totalIdx)}" cy="${y(val)}" r="4.5" class="point-forecast" />
                <text x="${x(totalIdx)}" y="${y(val) - 12}" text-anchor="middle">${val}${unit}</text>
              </g>
            `;
          });
        }

        const xLabels = [...labels, ...(forecast ? ["+1", "+2", "+3", "+4"] : [])].slice(0, totalPoints);
        xLabels.forEach((lbl, idx) => {
          svgHtml += `<text class="axis-label" x="${x(idx)}" y="${height - 12}" text-anchor="middle">${lbl}</text>`;
        });
        svgHtml += `</svg>`;

        let legendHtml = "";
        if (forecast) {
          legendHtml = `
            <div class="chart-legend">
              <span><i class="legend-line actual"></i> Факт</span>
              <span><i class="legend-line forecast"></i> Прогноз</span>
            </div>
          `;
        }

        return `<div class="chart-scroll" role="img" aria-label="${label}">${svgHtml}${legendHtml}</div>`;
      }

      function renderDonutChart(items, label) {
        const total = items.reduce((sum, item) => sum + item.value, 0);
        let offset = 25;
        let segmentsHtml = "";

        items.forEach((item) => {
          const dash = (item.value / total) * 100;
          segmentsHtml += `
            <circle
              cx="80"
              cy="80"
              r="54"
              class="donut-segment"
              stroke="${item.color}"
              stroke-dasharray="${dash} ${100 - dash}"
              stroke-dashoffset="${offset}"
            />
          `;
          offset -= dash;
        });

        return `
          <div class="donut-wrap" role="img" aria-label="${label}">
            <svg viewBox="0 0 160 160" class="donut-chart">
              <circle cx="80" cy="80" r="54" class="donut-base" />
              ${segmentsHtml}
              <text x="80" y="76" text-anchor="middle" class="donut-total">${total}</text>
              <text x="80" y="96" text-anchor="middle" class="donut-label">доля</text>
            </svg>
            <div class="donut-legend">
              ${items.map(item => `
                <span>
                  <i style="background-color: ${item.color}"></i>
                  ${item.label}
                  <b>${item.value}%</b>
                </span>
              `).join('')}
            </div>
          </div>
        `;
      }

      function renderBarChart(items, label) {
        const max = Math.max(...items.flatMap(item => [item.value, item.target ?? 0]));
        return `
          <div class="bar-chart" role="img" aria-label="${label}">
            ${items.map(item => `
              <div class="bar-row">
                <span>${item.label}</span>
                <div class="bar-track">
                  ${item.target ? `<i class="bar-target" style="left: ${(item.target / max) * 100}%" title="План"></i>` : ""}
                  <b style="width: ${(item.value / max) * 100}%"></b>
                </div>
                <strong>${item.value}</strong>
              </div>
            `).join('')}
          </div>
        `;
      }

      function renderBulletChart(value, target, label) {
        const percentage = clamp((value / target) * 100, 0, 130);
        const targetPosition = clamp((target / Math.max(value, target)) * 100, 0, 100);
        return `
          <div class="bullet" aria-label="${label}: факт ${value}, план ${target}">
            <div class="bullet-label">
              <span>${label}</span>
              <b>${value} / ${target}</b>
            </div>
            <div class="bullet-track">
              <span class="bullet-zone red"></span>
              <span class="bullet-zone yellow"></span>
              <span class="bullet-zone green"></span>
              <strong style="width: ${clamp(percentage, 0, 100)}%"></strong>
              <i style="left: ${targetPosition}%"></i>
            </div>
          </div>
        `;
      }

      function renderSparkline(values) {
        const width = 110;
        const height = 34;
        const min = Math.min(...values);
        const max = Math.max(...values);
        const xStep = width / Math.max(values.length - 1, 1);
        const path = values
          .map((val, idx) => {
            const xVal = idx * xStep;
            const yVal = height - ((val - min) / Math.max(max - min, 1)) * (height - 8) - 4;
            return `${idx === 0 ? "M" : "L"} ${xVal} ${yVal}`;
          })
          .join(" ");

        return `
          <svg class="sparkline" viewBox="0 0 ${width} ${height}" aria-hidden="true">
            <path d="${path}" />
          </svg>
        `;
      }

      function renderRiskMatrix(events) {
        let cellsHtml = "";
        [3, 2, 1].forEach((impact) => {
          [1, 2, 3, 4, 5].forEach((probability) => {
            const eventsInCell = events.filter((e) => e.impact === impact && e.probability === probability);
            const score = impact * probability;
            const severityClass = score >= 10 ? "matrix-red" : score >= 6 ? "matrix-yellow" : "matrix-green";
            const disabledAttr = eventsInCell.length ? "" : "disabled";
            const actionHtml = eventsInCell[0] ? `onclick="openRisk('${eventsInCell[0].id}')"` : "";

            cellsHtml += `
              <button
                class="matrix-cell ${severityClass}"
                ${actionHtml}
                ${disabledAttr}
                aria-label="Вероятность ${probability}, влияние ${impact}, событий ${eventsInCell.length}"
              >
                ${eventsInCell.map((e) => `
                  <span title="${e.title}">
                    ${e.title.slice(0, 2)}
                  </span>
                `).join("")}
              </button>
            `;
          });
        });

        return `
          <div class="risk-matrix" role="img" aria-label="Матрица риска вероятность и влияние">
            <span class="matrix-y">Влияние</span>
            <div class="matrix-grid">
              ${cellsHtml}
            </div>
            <span class="matrix-x">Вероятность</span>
          </div>
        `;
      }

                    </div>
                    <strong>${issue.value}%</strong>
                    <div class="mini-progress" aria-label="${issue.metric} ${val}%">
                      <span style="width: ${val}%"></span>
                    </div>
                    <p>${issue.explanation}</p>
                    <small>Цель: ${issue.target}%</small>
                  </article>
                `;
                })
                .join("")}
            </div>

            <section class="chart-card">
              <div class="card-heading">
                <h3>Каталог источников</h3>
                <p>Каждый источник имеет владельца, периодичность, качество, SLA и резервный вариант.</p>
              </div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Источник</th>
                      <th>Тип</th>
                      <th>Владелец</th>
                      <th>Частота</th>
                      <th>Статус</th>
                      <th>Обновление</th>
                      <th>Качество</th>
                      <th>SLA</th>
                      <th>Ошибки</th>
                      <th>Резерв</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${dataSources
                      .map(
                        (src) => `
                      <tr>
                        <td>${src.name}</td>
                        <td>${src.type}</td>
                        <td>${src.owner}</td>
                        <td>${src.updateFrequency}</td>
                        <td><span class="status-badge ${riskClass(src.status)}">${src.status}</span></td>
                        <td>${src.lastUpdate}</td>
                        <td>${src.qualityScore}%</td>
                        <td>${src.sla}</td>
                        <td>${src.errors}</td>
                        <td>${src.fallbackOption}</td>
                      </tr>
                    `
                      )
                      .join("")}
                  </tbody>
                </table>
              </div>
            </section>

            <section class="chart-card">
              <div class="card-heading">
                <h3>Статус интеграций</h3>
                <p>Техническое состояние обменов, задержки и последние синхронизации.</p>
              </div>
              <div class="integration-grid">
                ${integrationStatuses
                  .map(
                    (intg) => `
                  <article class="integration-card">
                    <div class="card-heading inline-heading">
                      <h3>${intg.system}</h3>
                      <span class="status-badge ${riskClass(intg.status)}">${intg.status}</span>
                    </div>
                    <p>${intg.notes}</p>
                    <span>Владелец: ${intg.owner}</span>
                    <span>Задержка: ${intg.latency}</span>
                    <span>Последняя синхронизация: ${intg.lastSync}</span>
                  </article>
                `
                  )
                  .join("")}
              </div>
            </section>
          </div>
        `;
      }

      function renderRoadmapSection() {
        const milestones = [
          ["Июль 2026", "Старт проекта и утверждение рабочего плана"],
          ["Сентябрь 2026", "Согласованы требования, данные и архитектура"],
          ["Декабрь 2026", "MVP — первая рабочая версия системы с основными функциями"],
          ["Январь-март 2027", "Проверка безопасности, тестирование и исправления"],
          ["Апрель-май 2027", "Пилотный запуск и обучение пользователей"],
          ["Июнь 2027", "Подготовка к промышленному запуску"],
          ["Июль 2027", "Запуск в промышленную эксплуатацию и передача IT"]
        ];

        return `
          <div class="content-stack">
            <header class="section-header">
              <div>
                <h1>Дорожная карта</h1>
                <p>План внедрения с июля 2026 по июль 2027, PERT-оценка и контроль ключевых вех.</p>
              </div>
            </header>

            <div class="pert-summary">
              <article>
                <span>Оптимистично</span>
                <strong>8 месяцев</strong>
              </article>
              <article>
                <span>Наиболее вероятно</span>
                <strong>12 месяцев</strong>
              </article>
              <article>
                <span>Пессимистично</span>
                <strong>16 месяцев</strong>
              </article>
              <article>
                <span>Итог PERT</span>
                <strong>12 месяцев</strong>
              </article>
            </div>

            <section class="chart-card">
              <div class="card-heading">
                <h3>Таймлайн проекта</h3>
                <p>Июль 2026 - июль 2027.</p>
              </div>
              <div class="roadmap">
                ${roadmapStages
                  .map(
                    (stage) => `
                  <article class="roadmap-stage">
                    <div>
                      <span>${stage.start} - ${stage.end}</span>
                      <h3>${stage.name}</h3>
                      <p>${stage.owner}</p>
                    </div>
                    <span class="status-badge ${riskClass(stage.status)}">${stage.status}</span>
                    <div class="mini-progress" aria-label="Прогресс ${stage.name} ${stage.progress}%">
                      <span style="width: ${stage.progress}%"></span>
                    </div>
                    <ul>
                      ${stage.deliverables.map((d) => `<li>${d}</li>`).join("")}
                    </ul>
                  </article>
                `
                  )
                  .join("")}
              </div>
            </section>

            <div class="two-column">
              <section class="chart-card">
                <div class="card-heading">
                  <h3>PERT-таблица</h3>
                  <p>Оценки указаны в месяцах.</p>
                </div>
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>Этап</th>
                        <th>O</th>
                        <th>M</th>
                        <th>P</th>
                        <th>PERT</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${pertRows
                        .map(
                          (row) => `
                        <tr>
                          <td>${row[0]}</td>
                          <td>${row[1]}</td>
                          <td>${row[2]}</td>
                          <td>${row[3]}</td>
                          <td>${row[4]}</td>
                        </tr>
                      `
                        )
                        .join("")}
                    </tbody>
                  </table>
                </div>
              </section>

              <section class="chart-card">
                <div class="card-heading">
                  <h3>Ключевые вехи</h3>
                  <p>Контрольные точки для руководства и проектной команды.</p>
                </div>
                <div class="milestone-list">
                  ${milestones
                    .map(
                      (m) => `
                    <article>
                      <span>${m[0]}</span>
                      <strong>${m[1]}</strong>
                    </article>
                  `
                    )
                    .join("")}
                </div>
              </section>
            </div>
          </div>
        `;
      }

      function renderAdminSection() {
        const areaAccess = (roleName, area) => {
          const rule = `${roleName}-${area}`;
          const full = ["Руководство банка-Обзор", "Администратор-Администрирование", "IT support-Источники"];
          if (full.includes(rule)) return "Полный";
          if (roleName === "Администратор") return "Полный";
          if (roleName === "RM" && ["Клиенты", "Рекомендации"].includes(area)) return "Свои клиенты";
          if (roleName === "Риск-менеджмент" && ["Риски", "Клиенты"].includes(area)) return "Полный";
          if (roleName === "Комплаенс" && ["Риски", "Источники"].includes(area)) return "Полный";
          if (roleName === "Data owner" && ["Источники", "Методики"].includes(area)) return "Полный";
          if (roleName === "Аналитик" && ["Обзор", "Методики", "Источники"].includes(area)) return "Настройка";
          if (roleName === "EXIM бизнес" && ["Обзор", "Клиенты", "Рекомендации"].includes(area)) return "Полный";
          if (roleName === "IT support" && ["Источники", "Администрирование"].includes(area)) return "Техподдержка";
          return "Просмотр";
        };

        return `
          <div class="content-stack">
            <header class="section-header">
              <div>
                <h1>Администрирование</h1>
                <p>Роли, доступы, настройки, аудит, справочники и методология KPI для управляемого запуска.</p>
              </div>
            </header>

            <div class="dashboard-grid">
              <section class="chart-card">
                <div class="card-heading">
                  <h3>Пользователи и роли</h3>
                  <p>Ролевой доступ снижает риск несанкционированных действий.</p>
                </div>
                <div class="compact-list">
                  ${users
                    .map(
                      (u) => `
                    <article class="user-row">
                      <div>
                        <strong>${u.name}</strong>
                        <span>${u.role} · ${u.department}</span>
                        <small>Последний вход: ${u.lastLogin}</small>
                      </div>
                      <span class="status-badge ${riskClass(u.status)}">${u.status}</span>
                    </article>
                  `
                    )
                    .join("")}
                </div>
              </section>

              <section class="chart-card">
                <div class="card-heading">
                  <h3>Системные настройки</h3>
                  <p>В прототипе отображаются ключевые параметры промышленного контура.</p>
                </div>
                <div class="settings-list">
                  <label>
                    <input type="checkbox" checked> Требовать подтверждение ИИ-рекомендаций человеком
                  </label>
                  <label>
                    <input type="checkbox" checked> Вести аудит действий пользователей
                  </label>
                  <label>
                    <input type="checkbox" checked> Показывать качество данных на всех дашбордах
                  </label>
                  <label>
                    <input type="checkbox"> Автоматически скрывать закрытые события
                  </label>
                </div>
              </section>
            </div>

            <section class="chart-card">
              <div class="card-heading">
                <h3>Матрица доступа</h3>
                <p>Логика доступа: руководство видит решения, RM - своих клиентов, риски и комплаенс - события, IT - интеграции.</p>
              </div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Роль</th>
                      ${accessAreas.map((area) => `<th>${area}</th>`).join("")}
                    </tr>
                  </thead>
                  <tbody>
                    ${roles
                      .map(
                        (r) => `
                      <tr>
                        <td>${r.name}</td>
                        ${accessAreas.map((area) => `<td>${areaAccess(r.name, area)}</td>`).join("")}
                      </tr>
                    `
                      )
                      .join("")}
                  </tbody>
                </table>
              </div>
            </section>

            <div class="two-column">
              <section class="chart-card">
                <div class="card-heading">
                  <h3>Журнал аудита и решений</h3>
                  <p>Каждое действие фиксируется с владельцем, сигналом и результатом.</p>
                </div>
                <div class="compact-list">
                  ${state.decisions
                    .map(
                      (d) => `
                    <article class="compact-log">
                      <span>${d.date} · ${d.owner}</span>
                      <strong>${d.decision}</strong>
                      <small>${d.sourceSignal}</small>
                      <span class="status-badge ${riskClass(d.status)}">${d.status}</span>
                    </article>
                  `
                    )
                    .join("")}
                </div>
              </section>

              <section class="chart-card">
                <div class="card-heading">
                  <h3>Справочник методологии KPI</h3>
                  <p>Сложные термины объяснены простым языком для единой интерпретации.</p>
                </div>
                <div class="method-list">
                  <article>
                    <strong>Портфель EXIM</strong>
                    <span>Сумма активных продуктов, сделок и обязательств по экспортно-импортным операциям.</span>
                  </article>
                  <article>
                    <strong>Детализация</strong>
                    <span>Переход от общего показателя к клиенту, операции, продукту или маршруту.</span>
                  </article>
                  <article>
                    <strong>Прогноз риска</strong>
                    <span>Оценка вероятности ухудшения ситуации на горизонте 30 дней по текущим сигналам.</span>
                  </article>
                  <article>
                    <strong>MVP</strong>
                    <span>Первая рабочая версия системы с ключевыми функциями мониторинга и рекомендаций.</span>
                  </article>
                </div>
              </section>
            </div>

            <section class="chart-card">
              <div class="card-heading">
                <h3>Бюджетные резервы</h3>
                <p>Резерв нужен для ИБ-проверок, интеграций и доработок после пилота.</p>
              </div>
              <div class="budget-grid">
                ${budgetItems
                  .map(
                    (b) => `
                  <article class="budget-card">
                    <div class="card-heading inline-heading">
                      <h3>${b.name}</h3>
                      <span class="status-badge ${riskClass(b.status)}">${b.status}</span>
                    </div>
                    <strong>${formatMoney(b.planned)}</strong>
                    <span>Резерв: ${formatMoney(b.reserved)}</span>
                  </article>
                `
                  )
                  .join("")}
              </div>
            </section>
          </div>
        `;
      }

      // -----------------------------------------------------------------
      // INITIALIZATION
      // -----------------------------------------------------------------
      updateView();
    </script>
  </body>
</html>
